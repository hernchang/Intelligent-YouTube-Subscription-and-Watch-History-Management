<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube 訂閱頻道智慧分類與管理面板</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f6f9;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #d32f2f;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .card {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid #ccc;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .card:hover { transform: translateY(-2px); }
        .card.active { border-width: 8px; background: #f0f7ff; }
        .card-cat-all { border-color: #1976d2; }
        .card-cat-1 { border-color: #e65100; }
        .card-cat-2 { border-color: #2e7d32; }
        .card-cat-3 { border-color: #c62828; }
        .card-cat-4 { border-color: #f57c00; }
        .card-cat-5 { border-color: #0288d1; }

        .card h3 { margin: 0 0 5px 0; font-size: 14px; color: #666; }
        .card .count { font-size: 24px; font-weight: bold; color: #222; }

        .controls {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }
        .select-box {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .table-container {
            background: #fff;
            border-radius: 8px;
            overflow-x: auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #fafafa;
            font-weight: 600;
            color: #555;
            position: sticky;
            top: 0;
        }
        tr:hover { background: #f9f9f9; }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-1 { background: #ffe0b2; color: #e65100; }
        .badge-2 { background: #c8e6c9; color: #2e7d32; }
        .badge-3 { background: #ffcdd2; color: #c62828; }
        .badge-4 { background: #ffe0b2; color: #f57c00; }
        .badge-5 { background: #b3e5fc; color: #0288d1; }

        .btn-unsubscribe {
            display: inline-block;
            padding: 6px 12px;
            background: #d32f2f;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn-unsubscribe:hover { background: #b71c1c; }

        .pagination {
            display: flex;
            justify: space-between;
            align-items: center;
            padding: 15px;
            background: #fff;
            border-top: 1px solid #eee;
        }
        .page-btn {
            padding: 6px 12px;
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
        }
        .page-btn:disabled { opacity: 0.5; cursor: default; }
    </style>
</head>
<body>

<div class="container">
    <h1>📺 YouTube 訂閱頻道智慧分類管理面板</h1>
    <p style="color:#666;">已整合您的 <b>4,984 個訂閱頻道</b> 與 <b>近 6 個月觀看紀錄</b>。點擊下方卡片即可快速篩選。</p>

    <div class="summary-cards">
        <div class="card card-cat-all active" onclick="filterCategory('ALL')">
            <h3>全部訂閱頻道</h3>
            <div class="count" id="count-all">0</div>
        </div>
        <div class="card card-cat-3" onclick="filterCategory('3. 長期未觀看/已停更')">
            <h3>3. 長期未觀看/建議退訂</h3>
            <div class="count" id="count-cat3">0</div>
        </div>
        <div class="card card-cat-1" onclick="filterCategory('1. 經常直播')">
            <h3>1. 經常直播</h3>
            <div class="count" id="count-cat1">0</div>
        </div>
        <div class="card card-cat-2" onclick="filterCategory('2. 經常觀看')">
            <h3>2. 經常觀看</h3>
            <div class="count" id="count-cat2">0</div>
        </div>
        <div class="card card-cat-4" onclick="filterCategory('4. 高頻更新/低推播')">
            <h3>4. 高頻更新/低推播</h3>
            <div class="count" id="count-cat4">0</div>
        </div>
        <div class="card card-cat-5" onclick="filterCategory('5. 新聞頻道')">
            <h3>5. 新聞頻道</h3>
            <div class="count" id="count-cat5">0</div>
        </div>
    </div>

    <div class="controls">
        <input type="text" id="searchInput" class="search-box" placeholder="搜尋頻道名稱或關鍵字..." oninput="onSearchChange()">
        <select id="categorySelect" class="select-box" onchange="onCategorySelectChange()">
            <option value="ALL">所有分類</option>
            <option value="3. 長期未觀看/已停更">3. 長期未觀看/已停更 (優先退訂)</option>
            <option value="1. 經常直播">1. 經常直播</option>
            <option value="2. 經常觀看">2. 經常觀看</option>
            <option value="4. 高頻更新/低推播">4. 高頻更新/低推播</option>
            <option value="5. 新聞頻道">5. 新聞頻道</option>
        </select>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>頻道名稱</th>
                    <th>自動分類標籤</th>
                    <th>近期觀看次數</th>
                    <th>最後觀看日期</th>
                    <th>快速管理 / 取消訂閱</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
        <div class="pagination">
            <span id="pageInfo">顯示 0 - 0 筆，共 0 筆</span>
            <div>
                <button class="page-btn" id="prevBtn" onclick="changePage(-1)">上一頁</button>
                <button class="page-btn" id="nextBtn" onclick="changePage(1)">下一頁</button>
            </div>
        </div>
    </div>
</div>

let currentCategory = 'ALL';
let currentSearch = '';
let currentPage = 1;
const pageSize = 50;

function init() {
    updateCounts();
    render();
}

function updateCounts() {
    document.getElementById('count-all').innerText = data.length.toLocaleString();
    
    const counts = {
        '1. 經常直播': 0,
        '2. 經常觀看': 0,
        '3. 長期未觀看/已停更': 0,
        '4. 高頻更新/低推播': 0,
        '5. 新聞頻道': 0
    };

    data.forEach(item => {
        if (counts[item.category] !== undefined) counts[item.category]++;
    });

    document.getElementById('count-cat1').innerText = counts['1. 經常直播'].toLocaleString();
    document.getElementById('count-cat2').innerText = counts['2. 經常觀看'].toLocaleString();
    document.getElementById('count-cat3').innerText = counts['3. 長期未觀看/已停更'].toLocaleString();
    document.getElementById('count-cat4').innerText = counts['4. 高頻更新/低推播'].toLocaleString();
    document.getElementById('count-cat5').innerText = counts['5. 新聞頻道'].toLocaleString();
}

function getFilteredData() {
    return data.filter(item => {
        const matchCategory = (currentCategory === 'ALL') || (item.category === currentCategory);
        const matchSearch = !currentSearch || item.name.toLowerCase().includes(currentSearch.toLowerCase());
        return matchCategory && matchSearch;
    });
}

function filterCategory(cat) {
    currentCategory = cat;
    document.getElementById('categorySelect').value = cat;
    currentPage = 1;
    
    // Update card styles
    document.querySelectorAll('.card').forEach(card => card.classList.remove('active'));
    if(cat === 'ALL') document.querySelector('.card-cat-all').classList.add('active');
    else if(cat.includes('1.')) document.querySelector('.card-cat-1').classList.add('active');
    else if(cat.includes('2.')) document.querySelector('.card-cat-2').classList.add('active');
    else if(cat.includes('3.')) document.querySelector('.card-cat-3').classList.add('active');
    else if(cat.includes('4.')) document.querySelector('.card-cat-4').classList.add('active');
    else if(cat.includes('5.')) document.querySelector('.card-cat-5').classList.add('active');

    render();
}

function onCategorySelectChange() {
    filterCategory(document.getElementById('categorySelect').value);
}

function onSearchChange() {
    currentSearch = document.getElementById('searchInput').value.trim();
    currentPage = 1;
    render();
}

function changePage(delta) {
    currentPage += delta;
    render();
}

function getBadgeClass(cat) {
    if(cat.includes('1.')) return 'badge-1';
    if(cat.includes('2.')) return 'badge-2';
    if(cat.includes('3.')) return 'badge-3';
    if(cat.includes('4.')) return 'badge-4';
    if(cat.includes('5.')) return 'badge-5';
    return '';
}

function render() {
    const filtered = getFilteredData();
    const total = filtered.length;
    const totalPages = Math.ceil(total / pageSize) || 1;
    
    if (currentPage < 1) currentPage = 1;
    if (currentPage > totalPages) currentPage = totalPages;

    const start = (currentPage - 1) * pageSize;
    const end = Math.min(start + pageSize, total);
    const pageItems = filtered.slice(start, end);

    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = pageItems.map(item => `
        <tr>
            <td><strong>${escapeHtml(item.name)}</strong></td>
            <td><span class="badge ${getBadgeClass(item.category)}">${escapeHtml(item.category)}</span></td>
            <td>${item.watch_count} 次</td>
            <td>${item.last_watched}</td>
            <td>
                <a href="${item.url}" target="_blank" class="btn-unsubscribe">前往頻道 / 取消訂閱 ↗</a>
            </td>
        </tr>
    `).join('');

    document.getElementById('pageInfo').innerText = `顯示 ${total === 0 ? 0 : start + 1} - ${end} 筆，共 ${total.toLocaleString()} 筆`;
    document.getElementById('prevBtn').disabled = (currentPage === 1);
    document.getElementById('nextBtn').disabled = (currentPage === totalPages);
}

function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

window.onload = init;
</script>
